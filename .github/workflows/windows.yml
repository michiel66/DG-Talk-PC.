name: DG-Talk PC Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dg-talk-pc-windows-main
  cancel-in-progress: true

jobs:
  gui-smoke:
    name: Radio Console visual regression
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Clone Windows GUI into safe folder
        shell: pwsh
        working-directory: 'C:\Windows\Temp'
        run: |
          git clone --depth 1 https://github.com/michiel66/DG-Talk-PC..git 'C:\DG-GUI'
          if ($LASTEXITCODE -ne 0) { throw "Could not checkout radio console" }
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Test real Tk Canvas widgets, spacer lines and PTT events
        shell: pwsh
        working-directory: 'C:\DG-GUI'
        run: |
          python -m pip install "Pillow>=11,<13"
          if ($LASTEXITCODE -ne 0) { throw "Pillow install error" }
          python -m compileall -q desktop
          if ($LASTEXITCODE -ne 0) { throw "Python syntax error" }
          python desktop/test_spacers.py
          if ($LASTEXITCODE -ne 0) { throw "TS3 separator tests failed" }
          python desktop/test_console.py
          if ($LASTEXITCODE -ne 0) { throw "Custom Radio Console visual regression failed" }

  windows-x64:
    name: Native Windows TeamSpeak 3
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: 'C:\DG-BUILD'

    steps:
      # actions/checkout is broken on Windows for repo names ending in a dot.
      # Clone to a normal Windows folder rather than the broken GITHUB_WORKSPACE.
      - name: Clone DG-Talk PC and original Android voice engine without checkout
        working-directory: 'C:\Windows\Temp'
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\DG-BUILD' | Out-Null
          git clone --depth 1 https://github.com/michiel66/DG-Talk-PC..git 'C:\DG-BUILD'
          if ($LASTEXITCODE -ne 0) { throw "Could not clone DG-Talk-PC." }
          git clone --depth 1 https://github.com/michiel66/DG-Talk.git 'C:\DG-BUILD\engine'
          if ($LASTEXITCODE -ne 0) { throw "Could not clone original DG-Talk" }
          git -C 'C:\DG-BUILD\engine' fetch --depth 1 origin df456ef5b6b9a41b74e58758dd7cbe94f9c50e51
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch pinned TS3 engine" }
          git -C 'C:\DG-BUILD\engine' checkout --detach df456ef5b6b9a41b74e58758dd7cbe94f9c50e51
          if ($LASTEXITCODE -ne 0) { throw "Could not checkout pinned TS3 engine" }

      - name: Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          rustup default 1.99.0

      - name: Compile real TS3 Rust Opus engine for Windows
        working-directory: 'C:\DG-BUILD\engine'
        run: |
          cargo build --release --locked -p tscore
          if ($LASTEXITCODE -ne 0) { throw "Windows TeamSpeak voice compilation failed" }
          if (-not (Test-Path "target/release/tscore.dll")) { throw "tscore.dll not found" }

      - name: Generate Windows UniFFI Python bindings
        working-directory: 'C:\DG-BUILD\engine'
        run: |
          New-Item -ItemType Directory -Force ../desktop/bindings | Out-Null
          cargo run --release --locked -p uniffi-bindgen -- generate --library target/release/tscore.dll --language python --out-dir ../desktop/bindings
          if ($LASTEXITCODE -ne 0) { throw "UniFFI Python binding generation failed" }
          Copy-Item target/release/tscore.dll ../desktop/bindings/tscore.dll
          if (-not (Test-Path "../desktop/bindings/tscore.py")) { throw "Missing tscore.py" }

      - name: Install native Windows GUI and audio packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows Python dependencies failed" }

      - name: Draw and validate full-colour icons and Windows application ICO
        run: |
          python desktop/color_icons.py --test --write desktop/assets/DG-Talk-PC.ico
          if ($LASTEXITCODE -ne 0) { throw "Coloured DG-Talk icons failed" }
          python -c "from PIL import Image; im=Image.open('desktop/assets/DG-Talk-PC.ico'); assert (256,256) in im.ico.sizes(); assert (32,32) in im.ico.sizes(); print('Coloured Windows ICO: OK')"
          if ($LASTEXITCODE -ne 0) { throw "The Windows application icon is missing or incomplete" }

      - name: Copy original Android themes into Windows UI
        run: |
          New-Item -ItemType Directory -Force desktop/assets | Out-Null
          Copy-Item engine/android/app/src/main/res/drawable-nodpi/dg_theme_*_preview.jpg desktop/assets/
          if ((Get-ChildItem desktop/assets/dg_theme_*_preview.jpg).Count -ne 4) { throw "Missing Android theme pictures" }

      - name: Test Windows native voice core and Rogerbeep
        run: |
          python -m compileall -q desktop
          if ($LASTEXITCODE -ne 0) { throw "Python syntax error" }
          $env:PYTHONPATH = (Resolve-Path desktop/bindings).Path
          python -c "import tscore; x=tscore.create_identity(); assert len(x)>10; print('Real Rust TeamSpeak core / UniFFI: OK')"
          if ($LASTEXITCODE -ne 0) { throw "Native voice engine test failed" }
          python desktop/test_audio.py
          if ($LASTEXITCODE -ne 0) { throw "Rogerbeep regression tests failed" }
          python desktop/test_spacers.py
          if ($LASTEXITCODE -ne 0) { throw "TeamSpeak spacer regression tests failed" }
          python -c "import sys; sys.path.insert(0,'desktop'); import main; assert callable(main.enable_high_dpi_windows); print('Windows high-DPI UI module: OK')"
          if ($LASTEXITCODE -ne 0) { throw "Windows 4K DPI-aware UI import failed" }

      - name: Build DG-Talk-PC.exe native Windows app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name DG-Talk-PC --icon "desktop/assets/DG-Talk-PC.ico" --paths desktop --paths desktop/bindings --hidden-import pynput.keyboard._win32 --collect-all sounddevice --add-binary "desktop/bindings/tscore.dll;." --add-data "desktop/assets;assets" desktop/main.py
          if ($LASTEXITCODE -ne 0) { throw "DG-Talk PC EXE packaging failed" }
          if (-not (Test-Path "dist/DG-Talk-PC/DG-Talk-PC.exe")) { throw "Windows EXE missing" }
          if (-not (Test-Path "dist/DG-Talk-PC/_internal/assets/DG-Talk-PC.ico")) { throw "Coloured app icon is missing from portable bundle" }
          Copy-Item engine/LICENSE dist/DG-Talk-PC/LICENSE-DG-TALK.txt
          Copy-Item engine/THIRD_PARTY.md dist/DG-Talk-PC/THIRD_PARTY.md
          Copy-Item -Recurse engine/docs/licenses dist/DG-Talk-PC/licenses
          Copy-Item README.md dist/DG-Talk-PC/README.txt

      - name: Upload portable DG-Talk PC Windows x64 EXE
        uses: actions/upload-artifact@v4
        with:
          name: DG-Talk-PC-Windows-x64
          path: 'C:\DG-BUILD\dist\DG-Talk-PC\'
          if-no-files-found: error
          retention-days: 30

      - name: Create optional Windows setup EXE (Inno Setup)
        continue-on-error: true
        run: |
          $compiler = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup missing" }
          & $compiler 'C:\DG-BUILD\installer\DG-Talk-PC.iss'
          if ($LASTEXITCODE -ne 0) { throw "Windows Setup compilation failed" }
          if (-not (Test-Path 'installer/output/DG-Talk-PC-Setup.exe')) { throw "Installer EXE missing" }
          $script = Get-Content 'installer/DG-Talk-PC.iss' -Raw
          if ($script -notmatch [regex]::Escape('Name: "{userdesktop}\DG-Talk PC"')) {
            throw "Mandatory desktop shortcut was not configured"
          }
          if ($script -match '(?i)Tasks:\s*desktopicon') {
            throw "Desktop shortcut is still optional"
          }

      - name: Upload DG-Talk PC Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DG-Talk-PC-Setup-Windows-x64
          path: 'C:\DG-BUILD\installer\output\DG-Talk-PC-Setup.exe'
          if-no-files-found: warn
          retention-days: 30
